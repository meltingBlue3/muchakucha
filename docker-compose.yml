version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: muchakucha_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-family_calendar}
      MYSQL_USER: ${DB_USER:-family_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-family_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # FastAPI 后端应用
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchakucha_backend
    restart: unless-stopped
    environment:
      # 应用配置
      APP_NAME: ${APP_NAME:-Family Calendar API}
      DEBUG: ${DEBUG:-False}
      
      # 数据库配置
      DATABASE_URL: mysql+pymysql://${DB_USER:-family_user}:${DB_PASSWORD:-family_password}@db:3306/${DB_NAME:-family_calendar}
      
      # 安全配置
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 开发模式：挂载代码以支持热重载（生产环境应移除）
      - .:/app
    networks:
      - app_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
    driver: local

networks:
  app_network:
    driver: bridge

