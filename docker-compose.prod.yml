version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: muchakucha_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    # 生产环境：不暴露数据库端口到宿主机（更安全）
    # 如需外部访问，取消下面注释
    # ports:
    #   - "3306:3306"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # FastAPI 后端应用
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: muchakucha-backend:latest
    container_name: muchakucha_backend_prod
    restart: always
    environment:
      # 应用配置
      APP_NAME: ${APP_NAME:-Family Calendar API}
      DEBUG: False  # 生产环境强制关闭 DEBUG
      
      # 数据库配置
      DATABASE_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      
      # 安全配置
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    # 生产环境：不挂载代码卷（使用镜像内的代码）
    # 使用生产命令（多 worker，无 reload）
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      replicas: 1

  # Nginx 反向代理（可选，用于 SSL 和负载均衡）
  # nginx:
  #   image: nginx:alpine
  #   container_name: muchakucha_nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - app_network

volumes:
  mysql_data_prod:
    driver: local

networks:
  app_network:
    driver: bridge

